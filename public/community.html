  <meta charset="UTF-8">

  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/community.css">
  <link rel="stylesheet" href="/community-contact.css">
  <script defer src="/language-core.js"></script>

  <script defer src="/assets/exceljs.min.js"></script>

<body class="community-page">
  <header class="masthead">
    <a class="brand" href="/"><span class="brand-mark">●<i>●</i><b>●</b></span><span>风土图鉴<small>TERROIR ATLAS</small></span></a>
    <nav aria-label="主导航"><a href="/">探索地图</a><a href="/catalog">酒庄与酒款</a><a href="/reports">每日简报</a><a href="/community">参与共建</a></nav>
    <span class="header-note">有据可查，才能落在地图上。</span>
  </header>
  <main class="workspace">
    <aside class="workspace-rail">
      <div class="eyebrow">CONTRIBUTE & CONNECT</div>
      <button data-view="catalog">资料库</button>
      <button data-view="contact">联系上传与模板</button>
      <button data-view="new" class="admin-only" hidden>管理员录入</button>
      <button data-view="mine" class="admin-only" hidden>我的投稿</button>
      <button data-view="import" class="admin-only" hidden>管理员批量导入</button>

      <button data-view="members" id="membersNav" class="admin-only" hidden>成员与邀请</button>
      <div class="profile" id="profile">正在识别登录身份…</div>
    </aside>
    <section class="workspace-content">
      <div id="workspaceMessage" role="status" hidden></div>
      <div id="content"><p class="lede">正在载入资料上传说明…</p></div>
    </section>
  </main>
