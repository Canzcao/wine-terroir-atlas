name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate catalogue and events
        run: npm run validate

      # ★ 必须先构建再测试：tests/workflows.test.mjs 用 miniflare 加载
      #   dist/server/index.js，未构建时该用例会以 ENOENT 失败。
      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
